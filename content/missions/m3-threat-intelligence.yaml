      - id: t1053_005
        correct: true
        label: {ja: "T1053.005 スケジュールされたタスク", en: "T1053.005 Scheduled task"}
        link: "https://attack.mitre.org/techniques/T1053/005/"
      - id: t1071_001
        correct: true
        label: {ja: "T1071.001 Web プロトコル", en: "T1071.001 Web protocols"}
        link: "https://attack.mitre.org/techniques/T1071/001/"
      - id: t1560_001
        correct: true
        label: {ja: "T1560.001 収集データのアーカイブ化", en: "T1560.001 Archive collected data"}
        link: "https://attack.mitre.org/techniques/T1560/001/"
      - id: t1041
        correct: true
        label: {ja: "T1041 C2（指令・制御）チャネル経由の外部送信", en: "T1041 Exfiltration over C2 (command-and-control) channel"}
        link: "https://attack.mitre.org/techniques/T1041/"
      - id: t1195_002
        label: {ja: "T1195.002 ソフトウェアサプライチェーンの侵害", en: "T1195.002 Supply chain compromise"}
