slug: threat-intelligence
kind: mission
order: 3
version: "2.0"
duration_seconds: 3600
max_points: 100

budget:
  correctness: 35
  evidence: 30
  reasoning: 20
  completeness: 10
  speed: 5

short_label: {ja: "M3", en: "M3"}
title:
  ja: "ミッション3 — 端末解析と影響範囲の判定"
  en: "Mission 3 — Endpoint Analysis and Scoping"
subtitle:
  ja: "実行・永続化・外部送信を時系列で整理し、影響範囲を判断する"
  en: "Build the execution, persistence and exfiltration timeline, then determine scope"

narrative:
  ja: |-
    SR-DEV-077 の端末トリアージ資料と、管理された環境でのサンドボックス解析レポートが提供されました。ここからは防御側として分析します。

    何が実行され、どのような永続化が行われ、どのデータが外部へ送信されたのかを時系列で整理してください。次に、テレメトリに現れる3台の端末（SR-DEV-077 / SR-FIN-014 / SR-LAB-021）を、根拠に基づいて分類してください。
  en: |-
    You have the SR-DEV-077 endpoint triage material and a controlled sandbox report. Analyse the incident from the defender's side.

    Build a timeline of execution, persistence and data sent outside the host. Then classify each of the three hosts in the telemetry — SR-DEV-077, SR-FIN-014 and SR-LAB-021 — using evidence.

objectives:
  - ja: "この端末で起きたことを、出典付きで時系列に整理する"
    en: "Build an evidence-backed timeline for the endpoint"
  - ja: "3台の端末を証拠の強さに応じて分類する"
    en: "Classify the three hosts using the strength of the evidence"
  - ja: "観測された挙動を ATT&CK の技術IDに対応付ける"
    en: "Map observed behaviour to ATT&CK technique ids"
  - ja: "観測されていない挙動を、観測済みとして扱わない"
    en: "Keep unobserved behaviour out of the observed findings"

loop:
  - ja: "5分：資料を分担して読み、各自が気づいたことを最低1件ボードに書く"
    en: "5 min — split the sources, read, and each post at least one observation"
    seconds: 300
  - ja: "35分：時系列を組み立て、端末ごとに証拠を確認する"
    en: "35 min — build the timeline and compare the evidence host by host"
    seconds: 2100
  - ja: "12分：回答と確信度を決める"
    en: "12 min — decide the answers and confidence"
    seconds: 720
  - ja: "8分：回答と根拠を見直して提出内容をロックする"
    en: "8 min — review the answers and evidence, then lock the submission"
    seconds: 480

first_step:
  ja: "手分けしてください。1人はミッション2で計算したハッシュを VirusTotal で検索し、表示内容を記録します。ファイルやURLは送信しないでください。残りのメンバーは file-timeline.csv を時刻順に読み、SR-DEV-077 のダウンロード完了とプロセス開始の時刻を確認してください。"
  en: "Split the work. One member looks up the Mission 2 hash in VirusTotal and records what is shown without submitting a file or URL. Everyone else starts with file-timeline.csv and checks the download and process-start times for SR-DEV-077."

artifacts:
  - id: evidence-pack
    type: text
    icon: "▤"
    tool: "triage pack"
    path: threat-intelligence/triage_pack_readme.txt
    external_url: "${m3_evidence_pack}"
    tool_name: "Web browser"
    resource_type: first_party
    title: {ja: "端末トリアージパック（SR-DEV-077）", en: "Endpoint triage pack (SR-DEV-077)"}
    note: {ja: "すべての時刻はUTCです。まず、各ファイルが何を記録しているか確認してください。", en: "All timestamps are UTC. Start by checking what each file records."}
    expected_pivot:
      ja: "この端末で何が起きたかを時刻順に整理してください。"
      en: "Establish what happened on this endpoint and in what order."
    safety_notice:
      ja: "提供されたファイルは、安全性が確認されていないものとして扱ってください。実行せず、静的解析、提供済みのレポート、ハッシュ検索だけを使ってください。"
      en: "Treat the supplied files as untrusted evidence. Do not execute them; use static analysis, provided reports and hash-only lookups."
    hints:
      - id: pv_evidence_pack_orientation
        level: orientation
        cost: 0
        label: {ja: "この資料のどこを見るか", en: "Where in this source"}
        text:
          ja: "まずファイル一覧を確認し、設問ごとに使うファイルを選んでください。"
          en: "Check the file list first and choose the file that matches the question you are working on."
      - id: pv_pack_recovery
        level: recovery
        cost: 0
        label: {ja: "この資料で行き詰まった", en: "Stuck on this source"}
        text:
          ja: "すべてのファイルを同時に読む必要はありません。時刻、プロセス、永続化、通信など、確認したい内容に合うファイルから読んでください。"
          en: "Do not read every file at once. Pick the file that matches what you need: time, process, persistence, network activity or another specific fact."

  - id: file-timeline
    how_to:
      tool: {ja: "表計算ソフト（Excel / Numbers / Google スプレッドシート）", en: "Spreadsheet (Excel / Numbers / Google Sheets)"}
      steps:
        - ja: "CSV をダウンロードして表計算ソフトで開いてください。"
          en: "Download the CSV and open it in a spreadsheet."
        - ja: "最初に host 列で対象端末を絞り込んでください。端末名はこのミッション冒頭の説明に3台とも書かれています。3台すべての行がこの資料にあるとは限りません。"
          en: "Filter the host column first. All three endpoint names are in the mission briefing at the top of this mission — not all of them necessarily have rows in this file."
        - ja: "次に時刻を昇順に並べ替えてください。"
          en: "Then sort by time, oldest first."
        - ja: "event 列を確認し、ファイル書き込みとプロセス開始を区別してください。"
          en: "Read the event column and distinguish file writes from process starts."
      commands:
        - os: {ja: "macOS / Linux（ターミナルを使う場合）", en: "macOS / Linux (terminal option)"}
          cmd: "grep SR-FIN-014 file-timeline.csv | sort -t, -k1,1"
        - os: {ja: "Windows (PowerShell)（ターミナルを使う場合）", en: "Windows (PowerShell) (terminal option)"}
          cmd: 'Import-Csv .\file-timeline.csv | Where-Object host -eq ''SR-FIN-014'' | Sort-Object timestamp_utc | Format-Table -AutoSize'
      no_install:
        ja: "Google スプレッドシートでもフィルタと並べ替えができます。"
        en: "Google Sheets can also filter and sort the file."
    type: table
    icon: "≡"
    tool: "csv viewer"
    path: threat-intelligence/file_timeline.csv
    external_url: "${m3_file_timeline}"
    tool_name: Spreadsheet
    resource_type: first_party
    title: {ja: "ファイルに関するイベントの時系列（複数端末）", en: "File timeline (several hosts)"}
    note: {ja: "複数の端末の記録が含まれています。host 列で対象端末を絞り込んでください。", en: "The file contains rows for several hosts. Filter by host first."}
    expected_pivot:
      ja: "file-timeline.csv を時刻順に並べ、対象端末のイベントを確認してください。"
      en: "Sort file-timeline.csv by time and inspect the events for the target host."
    hints:
      - id: pv_file_timeline_orientation
        level: orientation
        cost: 0
        label: {ja: "この資料のどこを見るか", en: "Where in this source"}
        text:
          ja: "host 列で絞り込み、時刻順に並べたあと event 列を確認してください。"
          en: "Filter by host, sort by time, then read the event column."
      - id: pv_file_timeline_recovery
        level: recovery
        cost: 0
        label: {ja: "この資料で行き詰まった", en: "Stuck on this source"}
        text:
          ja: "実行時刻を探す場合は、ファイル書き込みではなくプロセス開始を記録した行を使ってください。"
          en: "For execution time, use the row that records a process start, not a file write."

  - id: virustotal
    type: json
    icon: "◎"
    tool: "reputation lookup"
    path: threat-intelligence/virustotal_lookup.json
    external_url: "${m3_virustotal}"
    tool_name: "VirusTotal"
    resource_type: third_party_tool
    title: {ja: "VirusTotal のレピュテーション照会", en: "Reputation lookup (VirusTotal)"}
    note: {ja: "「Detection」タブには、各セキュリティエンジンによる判定結果が表示されます。このファイルの挙動を直接観測した結果ではありません。", en: "The Detection tab you are reading here aggregates verdicts recorded by other engines. It is not an observation of this file's behaviour."}
    expected_pivot:
      ja: "ミッション2で計算した SHA-256 を検索し、表示内容をそのまま記録してください。"
      en: "Search for the SHA-256 from Mission 2 and record exactly what is shown."
    safety_notice:
      ja: "ハッシュ検索だけを行ってください。ファイルやURLを送信せず、Reanalyze も実行しないでください。"
      en: "Search by hash only. Do not upload a file, submit a URL or click Reanalyze."
    hints:
      - id: pv_virustotal_orientation
        level: orientation
        cost: 0
        label: {ja: "この資料のどこを見るか", en: "Where in this source"}
        text:
          ja: "検索欄にハッシュを貼り付けるか、/gui/file/<ハッシュ> を直接開いてください。ファイルやURLは送信しません。表示された内容を記録し、結果が無い場合もそのまま記録します。"
          en: "Paste the hash into the search box, or open /gui/file/<hash> directly. Do not submit a file or a URL. Record what the page shows — and if there is no result, record that too."
      - id: pv_virustotal_recovery
        level: recovery
        cost: 0
        label: {ja: "この資料で行き詰まった", en: "Stuck on this source"}
        text:
          ja: "表示された情報と、そこから判断できることを分けてください。検出数はファイルの挙動を直接観測した結果ではなく、検索結果がないことも安全の証明にはなりません。ファイルが安全か、悪意のあるものかは、サンドボックスレポートと端末の証跡に基づいて判断してください。"
          en: "Separate what the page displays from what that information can establish. A detection count is not a direct observation of behaviour, and an empty result is not a clean bill of health. Safe or malicious is decided on the sandbox report and the endpoint evidence."

  - id: mitre
    type: json
    icon: "◈"
    tool: "ATT&CK"
    path: threat-intelligence/mitre_reference.json
    external_url: "${m3_attack}"
    tool_name: "MITRE ATT&CK"
    resource_type: third_party_content
    title: {ja: "ATT&CK 技術リファレンス", en: "ATT&CK technique reference"}
    note: {ja: "証拠から確認できた挙動をもとに、該当する ATT&CK の技術IDを調べてください。", en: "Start from the behaviour in the evidence and find the matching technique id."}
    expected_pivot:
      ja: "対応付けた技術IDごとに、根拠となる行を確認してください。"
      en: "For every mapped technique id, identify the evidence line supporting it."
    hints:
      - id: pv_mitre_orientation
        level: orientation
        cost: 0
        label: {ja: "この資料のどこを見るか", en: "Where in this source"}
        text:
          ja: "先に観測済みの挙動を一覧にし、ATT&CK で1つずつ調べてください。"
          en: "Bring your list of observed behaviours and look them up one at a time in ATT&CK."
      - id: pv_mitre_recovery
        level: recovery
        cost: 0
        label: {ja: "この資料で行き詰まった", en: "Stuck on this source"}
        text:
          ja: "根拠となる行を示せない技術は、観測済みの一覧から外してください。"
          en: "Remove any technique for which you cannot point to a supporting evidence line."

  - id: process-tree
    type: json
    icon: "⑂"
    tool: "process tree"
    path: threat-intelligence/process_tree.json
    external_url: "${m3_process_tree}"
    tool_name: Web browser
    resource_type: first_party
    title: {ja: "プロセスツリー（SR-DEV-077）", en: "Process tree (SR-DEV-077)"}
    note: {ja: "PID と親プロセスIDを使って、どのプロセスが何を起動したか確認してください。", en: "Use PID and parent PID to follow what launched what."}
    expected_pivot:
      ja: "process-tree.json を開き、PowerShell の親プロセスをたどってください。"
      en: "Open process-tree.json and trace the parent of the PowerShell process."
    hints:
      - id: pv_process_tree_orientation
        level: orientation
        cost: 0
        label: {ja: "この資料のどこを見るか", en: "Where in this source"}
        text:
          ja: "PowerShell の項目を見つけ、親プロセスIDを使って1段ずつ上にたどってください。"
          en: "Find the PowerShell entry and follow the parent ids upward one step at a time."
      - id: pv_process_tree_recovery
        level: recovery
        cost: 0
        label: {ja: "この資料で行き詰まった", en: "Stuck on this source"}
        text:
          ja: "PowerShell を直接起動した親プロセスを確認してください。Windows の一般的なシステムプロセスまで上がる必要はありません。"
          en: "Identify the process that directly launched PowerShell. You do not need to continue up to a general Windows system process."

  - id: persistence
    how_to:
      tool: {ja: "表計算ソフト（Excel / Numbers / Google スプレッドシート）", en: "Spreadsheet (Excel / Numbers / Google Sheets)"}
      steps:
        - ja: "リンクを開くと CSV がダウンロードされます。"
          en: "Opening the link downloads a CSV file."
        - ja: "保存したファイルを表計算ソフトで開いてください。"
          en: "Open the saved file in a spreadsheet."
        - ja: "必要に応じてフィルタを有効にし、すべての行を確認してください。"
          en: "Turn on filters if useful and inspect every row."
        - ja: "列幅を広げ、内容が切れないようにしてください。"
          en: "Widen the columns so the full values are visible."
      commands:
        - os: {ja: "macOS / Linux（ターミナルを使う場合）", en: "macOS / Linux (terminal option)"}
          cmd: "column -s, -t persistence.csv"
        - os: {ja: "Windows (PowerShell)（ターミナルを使う場合）", en: "Windows (PowerShell) (terminal option)"}
          cmd: 'Import-Csv .\persistence.csv | Format-Table -AutoSize' 
      no_install:
        ja: "表計算ソフトがなければ、Google スプレッドシートまたはテキストエディタで開いてください。"
        en: "If you do not have a spreadsheet app, use Google Sheets or a text editor."
    type: table
    icon: "◍"
    tool: "csv viewer"
    path: threat-intelligence/persistence.csv
    external_url: "${m3_persistence}"
    tool_name: Spreadsheet
    resource_type: first_party
    title: {ja: "永続化（レジストリとタスク）", en: "Persistence (registry and scheduled task)"}
    note: {ja: "1行が1件の記録です。1つの仕組みが複数行にまたがることがあります。各行の result 列を確認してください。", en: "Each row is one recorded entry, and one mechanism can occupy more than one row. Read the result column on each row."}
    expected_pivot:
      ja: "persistence.csv をダウンロードし、すべての行を確認してください。"
      en: "Download persistence.csv and inspect every row."
    hints:
      - id: pv_persistence_orientation
        level: orientation
        cost: 0
        label: {ja: "この資料のどこを見るか", en: "Where in this source"}
        text:
          ja: "CSV を表計算ソフトで開き、すべての行の result 列を確認してください。"
          en: "Open the CSV in a spreadsheet and check the result column on every row."
      - id: pv_persistence_recovery
        level: recovery
        cost: 0
        label: {ja: "この資料で行き詰まった", en: "Stuck on this source"}
        text:
          ja: "この事案で新しく作られたものと、以前から存在していたものを分けてください。それを示しているのは result 列です。時刻では分けられません。"
          en: "Separate mechanisms created during this incident from ones that already existed. The result column is what says which is which; the timestamps will not separate them."

  - id: sandbox
    type: sandbox
    icon: "⬢"
    tool: "sandbox report"
    path: threat-intelligence/sandbox_report.json
    external_url: "${m3_sandbox}"
    tool_name: "Sandbox report"
    resource_type: first_party
    title: {ja: "サンドボックスレポート（SBX-K42）", en: "Sandbox report (SBX-K42)"}
    note: {ja: "observed_behaviors と not_observed_in_sandbox を分けて読んでください。", en: "Read the observed and not_observed sections separately."}
    expected_pivot:
      ja: "観測された挙動を整理し、ATT&CK の技術IDに対応付けてください。"
      en: "Extract the observed behaviours and map them to ATT&CK technique ids."
    safety_notice:
      ja: "レポートの閲覧だけを行ってください。検体のダウンロードや実行はしないでください。"
      en: "Read the report only. Do not download or run a sample."
    hints:
      - id: pv_sandbox_orientation
        level: orientation
        cost: 0
        label: {ja: "この資料のどこを見るか", en: "Where in this source"}
        text:
          ja: "まず observed_behaviors の内容を読み、実際に観測された挙動を一覧にしてください。"
          en: "Read the observed section first and list the behaviours that were actually observed."
      - id: pv_sandbox_recovery
        level: recovery
        cost: 0
        label: {ja: "この資料で行き詰まった", en: "Stuck on this source"}
        text:
          ja: "observed_behaviors と not_observed_in_sandbox を混同しないでください。ATT&CK に対応付けるのは、実際に観測された挙動です。"
          en: "Keep observed and not_observed separate. Map ATT&CK techniques only from behaviour that the report actually observed."

  - id: network
    how_to:
      tool: {ja: "表計算ソフト（Excel / Numbers / Google スプレッドシート）", en: "Spreadsheet (Excel / Numbers / Google Sheets)"}
      steps:
        - ja: "CSV をダウンロードし、host 列で対象端末を絞り込んでください。端末名はこのミッション冒頭の説明に3台とも書かれています。"
          en: "Download the CSV and filter by host. All three endpoint names are in the mission briefing at the top of this mission."
        - ja: "process、destination、bytes_out、bytes_in を一緒に確認してください。"
          en: "Read process, destination, bytes_out and bytes_in together."
        - ja: "送信量の大きい通信と、その通信を行ったプロセスを確認してください。"
          en: "Check connections with large outbound transfers and the process responsible for them."
        - ja: "残りの端末も同じ手順で確認してください。端末ごとに確認できた事実を、影響範囲の判断に使います。"
          en: "Do this for all three. What each host does and does not show is what the scope question is decided on."
      commands:
        - os: {ja: "macOS / Linux（ターミナルを使う場合）", en: "macOS / Linux (terminal option)"}
          cmd: "grep SR-FIN-014 network-connections.csv | column -s, -t"
        - os: {ja: "Windows (PowerShell)（ターミナルを使う場合）", en: "Windows (PowerShell) (terminal option)"}
          cmd: 'Import-Csv .\network-connections.csv | Where-Object host -eq ''SR-FIN-014'' | Format-Table -AutoSize'
      no_install:
        ja: "Google スプレッドシートでも同じように確認できます。"
        en: "You can do the same in Google Sheets."
    type: table
    icon: "⇄"
    tool: "csv viewer"
    path: threat-intelligence/network_connections.csv
    external_url: "${m3_network}"
    tool_name: Spreadsheet
    resource_type: first_party
    title: {ja: "通信記録（3端末）", en: "Network connections (three hosts)"}
    note: {ja: "宛先だけでなく、通信したプロセスと送信量も確認してください。", en: "Check the process and outbound volume as well as the destination."}
    expected_pivot:
      ja: "network-connections.csv を確認し、どのプロセスが各通信を行ったか調べてください。"
      en: "Inspect network-connections.csv and identify which process made each connection."
    hints:
      - id: pv_network_orientation
        level: orientation
        cost: 0
        label: {ja: "この資料のどこを見るか", en: "Where in this source"}
        text:
          ja: "process、destination、bytes_out を一緒に見てください。"
          en: "Read process, destination and bytes_out together."
      - id: pv_network_recovery
        level: recovery
        cost: 0
        label: {ja: "この資料で行き詰まった", en: "Stuck on this source"}
        text:
          ja: "検体が行った通信を特定したあと、送信方向とサイズから外部送信に使われた通信を確認してください。"
          en: "After identifying connections made by the sample, use direction and size to find the connection used to send data out."

  - id: proxy-log
    type: text
    icon: "▣"
    tool: "log viewer"
    path: threat-intelligence/proxy.log
    external_url: "${m3_proxy_log}"
    tool_name: Web browser
    resource_type: first_party
    title: {ja: "プロキシログ（抜粋）", en: "Proxy log (extract)"}
    note: {ja: "プロキシに記録された外部への通信です。末尾に運用担当者のコメントが付いています。", en: "The proxy's record of outbound requests, with an operator's comment at the end of it."}
    expected_pivot:
      ja: "proxy.log を最後まで読み、各通信の結果を確認してください。"
      en: "Read proxy.log to the end and check the result of each request."
    hints:
      - id: pv_proxy_log_orientation
        level: orientation
        cost: 0
        label: {ja: "この資料のどこを見るか", en: "Where in this source"}
        text:
          ja: "ログを時刻順に最後まで読み、末尾のコメント行も確認してください。"
          en: "Read the log in time order through the final comment line."
      - id: pv_proxy_log_recovery
        level: recovery
        cost: 0
        label: {ja: "この資料で行き詰まった", en: "Stuck on this source"}
        text:
          ja: "末尾のコメントには、保持期間中に観測されなかったことが書かれています。端末の影響範囲を判断するときに使ってください。"
          en: "The closing comment records activity that was not seen during the retained window. Use it when assessing host scope."

  - id: powershell-log
    how_to:
      tool: "CyberChef"
      tool_link: "${tool_cyberchef}"
      steps:
        - ja: "ログから -EncodedCommand の後ろにある長い文字列をコピーしてください。"
          en: "Copy the long string after -EncodedCommand from the log."
        - ja: "CyberChef を開いてください。"
          en: "Open CyberChef."
        - ja: "From Base64 を Recipe に追加してください。"
          en: "Add From Base64 to the Recipe."
        - ja: "続けて Decode text を追加し、Encoding を UTF-16LE (1200) に設定してください。"
          en: "Then add Decode text and set Encoding to UTF-16LE (1200)."
        - ja: "文字列を Input に貼り付け、Output に出たコマンドを読んでください。"
          en: "Paste the string into Input and read the decoded command in Output."
      commands:
        - os: {ja: "macOS / Linux（ターミナルを使う場合）", en: "macOS / Linux (terminal option)"}
          cmd: "echo '' | base64 -d | iconv -f UTF-16LE -t UTF-8"
        - os: "Windows (PowerShell)"
          cmd: "[Text.Encoding]::Unicode.GetString([Convert]::FromBase64String(''))"
      no_install:
        ja: "CyberChef はブラウザで使えます。デコードした内容は実行せず、読むだけにしてください。"
        en: "CyberChef runs in the browser. Read the decoded text; do not execute it."
    type: text
    icon: "◧"
    tool: "log viewer"
    path: threat-intelligence/powershell_operational.log
    external_url: "${m3_powershell_log}"
    tool_name: CyberChef
    resource_type: first_party
    title: {ja: "PowerShell の Operational ログ", en: "PowerShell operational log"}
    note: {ja: "コマンドは UTF-16LE の文字列を Base64 でエンコードしたものです。デコードして内容を確認してください。", en: "The command is a UTF-16LE string encoded with Base64. Decode it before reading it."}
    expected_pivot:
      ja: "powershell-operational.log のコマンドラインをデコードしてください。"
      en: "Decode the command line recorded in powershell-operational.log."
    hints:
      - id: pv_powershell_log_orientation
        level: orientation
        cost: 0
        label: {ja: "この資料のどこを見るか", en: "Where in this source"}
        text:
          ja: "-EncodedCommand の後ろにある文字列を取り出し、資料ページの手順でデコードしてください。"
          en: "Copy the string after -EncodedCommand and decode it using the steps on the source page."
      - id: pv_powershell_log_recovery
        level: recovery
        cost: 0
        label: {ja: "この資料で行き詰まった", en: "Stuck on this source"}
        text:
          ja: "デコードしたコマンドの処理を順に読み、ほかの端末証跡で同じ動作が記録されているか確認してください。"
          en: "Read the decoded command step by step and check whether the same actions appear in the other endpoint evidence."

  - id: case-summary
    type: json
    icon: "◆"
    tool: "case file"
    path: threat-intelligence/case_summary.json
    external_url: "${m3_case_summary}"
    tool_name: Web browser
    resource_type: first_party
    title: {ja: "事案の概要（SR-IR-2026-0902）", en: "Case summary (SR-IR-2026-0902)"}
    note: {ja: "証拠パックの表紙にあたる書類です。", en: "The evidence pack's own cover sheet, written by whoever assembled it."}
    expected_pivot:
      ja: "事案の概要を読み、この証拠資料一式から確認できる範囲を整理してください。"
      en: "Read the case summary and note the limits of what this evidence pack can establish."
    hints:
      - id: pv_case_summary_orientation
        level: orientation
        cost: 0
        label: {ja: "この資料のどこを見るか", en: "Where in this source"}
        text:
