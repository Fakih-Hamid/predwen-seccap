        label: {ja: "SR-DEV-077", en: "SR-DEV-077"}
      - id: srfin014
        label: {ja: "SR-FIN-014", en: "SR-FIN-014"}
      - id: srlab021
        label: {ja: "SR-LAB-021", en: "SR-LAB-021"}
