      - id: m3_scope_h3
        level: method
        cost: 0
        unlock_after: 0
        text: {ja: "proxy.log の末尾コメントも確認し、保持期間中に観測されなかったことを端末ごとの判断に使ってください。", en: "Also read the closing proxy-log comment and use the stated absence of activity when classifying each host."}

  - key: m3_attack
