        text: {ja: "サンドボックスレポートの observed_behaviors を読んでください。", en: "Read the observed section of the sandbox report."}
      - id: m3_attack_h2
        level: pivot
        cost: 0
        unlock_after: 0
        text: {ja: "観測された挙動を1つずつ ATT&CK の技術IDに対応付けてください。", en: "Map each observed behaviour to its ATT&CK technique id."}
      - id: m3_attack_h3
        level: method
        cost: 0
        unlock_after: 0
        text: {ja: "not_observed_in_sandbox にある技術や、事案全体の説明だけに使われている技術は選ばないでください。", en: "Do not select techniques listed as not observed or used only to describe the wider incident."}

  - key: m3_vt_interpretation
    accepted_evidence: [virustotal, sandbox]
    type: free_text
    category: reasoning
    points: 0
    prompt: {ja: "VirusTotal の検索結果だけで、このファイルが安全か、悪意のあるものかを断定できますか。理由と、最終的な判断の根拠を説明してください。", en: "Can the VirusTotal search result alone establish whether this file is safe or malicious? Explain why, and what your final judgement actually rests on."}
    placeholder: {ja: "表示された内容、そこから言えること、最終判断の根拠を分けて書いてください。VirusTotal を開けない場合は、その旨を書いたうえで、サンドボックスレポートと端末証跡から答えてください。", en: "Separate what was shown, what it supports, and the evidence used for your final conclusion. If VirusTotal will not open, say so and answer from the sandbox report and the endpoint evidence instead."}
    hints:
      - id: m3_vt_interpretation_h1
        level: orientation
        cost: 0
        unlock_after: 0
        text: {ja: "ミッション2の SHA-256 を VirusTotal で検索してください。ハッシュ検索だけを行います。", en: "Look up the Mission 2 SHA-256 in VirusTotal. Use hash search only."}
      - id: m3_vt_interpretation_h2
        level: pivot
        cost: 0
        unlock_after: 0
        text: {ja: "「Detection」タブには、各セキュリティエンジンによる判定結果が表示されます。このファイルの挙動を直接観測した結果ではありません。挙動の根拠は、サンドボックスレポートで確認してください。", en: "What the Detection tab shows is verdict information recorded by other engines, not an observation of this file's behaviour. The behavioural evidence is in the sandbox report."}
      - id: m3_vt_interpretation_h3
        level: method
        cost: 0
        unlock_after: 0
        text: {ja: "ファイルが安全か、悪意のあるものかを判断する根拠を、SBX-K42 または端末の証跡から示してください。", en: "Name the SBX-K42 or endpoint evidence used to support your safe/malicious conclusion."}

  - key: m3_w_scope
    type: free_text
    category: reasoning
    points: 0
    prompt: {ja: "3台の端末をどのように分類し、それぞれ何を根拠にしましたか。", en: "How did you classify each of the three hosts, and what evidence supports each classification?"}
    placeholder: {ja: "端末ごとに1行で、分類とその根拠を書いてください。", en: "One line per host: classification and evidence."}

  - key: m3_w_observed
    type: free_text
    category: reasoning
    points: 0
    prompt: {ja: "インシデント全体には該当するものの、サンドボックスでは観測されていない ATT&CK 技術を挙げ、その違いを説明してください。", en: "Name an ATT&CK technique that applies to the wider incident but was not observed by the sandbox, and explain the difference."}
    placeholder: {ja: "観測された挙動と、事案全体の説明を分けて書いてください。", en: "Separate observed behaviour from the wider incident description."}

