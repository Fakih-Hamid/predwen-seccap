hints:
  - id: m3_h1
    level: orientation
    cost: 0
    label: {ja: "どこから読む？", en: "Where do we start?"}
    text:
      ja: "まず時系列を作ります。ダウンロード、実行、永続化、アップロードの時刻を資料から集めてください。"
      en: "Build the timeline first. Collect the download, execution, persistence and upload times from the evidence."
  - id: m3_h2
    level: pivot
    cost: 0
    label: {ja: "端末ごとの違いが分からない", en: "We cannot separate the hosts"}
    text:
      ja: "file-timeline.csv、network-connections.csv、persistence.csv を端末ごとに絞り込み、実行・永続化・外部送信の記録があるか確認してください。"
      en: "Filter file-timeline.csv, network-connections.csv and persistence.csv by host. Check which hosts have execution, persistence and outbound-transfer evidence."
  - id: m3_h3
    level: tool
    cost: 0
    label: {ja: "どのツールで何を見ればいい？", en: "Which tools should we use?"}
    text:
      ja: "CSV は表計算ソフトでフィルタと並べ替えを行います。PowerShell の文字列は CyberChef でデコードします。ATT&CK は、観測済みの挙動から技術IDを確認するために使います。手順は各資料ページに載っています。"
      en: "Use a spreadsheet to filter and sort the CSV files. Use CyberChef to decode the PowerShell string. Use ATT&CK to map behaviours you already observed to technique ids. Each source page carries the steps for the tool it needs."
  - id: m3_h4
    level: method
    cost: 0
    label: {ja: "観測と推測をどう分ける？", en: "How do we separate observation from inference?"}
    text:
      ja: "各主張を直接裏づける記録があるか確認してください。侵害の確認には、実行または永続化の記録を使います。ダウンロードや通信だけでは、侵害が確認されたとは言えません。技術IDごとに、根拠となる記録の行を示してください。"
      en: "Check whether each claim has a direct record. Use execution or persistence evidence for confirmed compromise. Download or network contact alone is not enough. Link every technique id to an observed evidence line."
  - id: m3_h5
    level: recovery
    cost: 0
    label: {ja: "行き詰まった：詳しいヒント", en: "Stuck: detailed hint"}
    text:
      ja: "端末ごとに進めてください。①CSV は最初に host 列で絞る。②file-timeline.csv では process_start を確認する。③process-tree では PowerShell の親 PID を追う。④persistence では result 列だけで新規作成か既存かを分ける（4行とも同じ1分内に記録されているため、時刻では分けられません）。⑤network と proxy.log で外部送信と完了時刻を確認する。⑥最後に3台を同じ基準で分類する。"
      en: "Work host by host: (1) filter every CSV by host first; (2) use process_start in the file timeline for execution; (3) follow PowerShell's parent PID in the process tree; (4) separate new from pre-existing using the persistence table's result column ALONE — all four rows were recorded inside the same minute, so the timestamp cannot tell them apart; (5) use network and proxy logs for outbound transfer and completion time; (6) classify all three hosts using the same evidence standard."

rubric:
  - key: m3_r_scope
    response_key: m3_w_scope
    category: reasoning
    points: 12
    prompt: {ja: "3台の端末をどのように分類し、それぞれ何を根拠にしましたか。", en: "How did you classify each of the three hosts, and what evidence supports each classification?"}
    placeholder: {ja: "端末ごとに1行で、分類とその根拠を書いてください。", en: "One line per host: classification and evidence."}
    criteria:
      ja: "SR-DEV-077 を「侵害確認済み」、SR-FIN-014 を「ダウンロードのみ確認」、SR-LAB-021 を「接続のみ確認」と分類し、それぞれの根拠を示していれば満点。3台すべてを侵害確認済みとした場合は0点。"
      en: "Full marks for confirmed / downloaded-only / contacted-only with evidence for each. Zero for declaring all three compromised."
  - key: m3_r_observed
    response_key: m3_w_observed
    category: reasoning
    points: 6
    prompt: {ja: "インシデント全体には該当するものの、サンドボックスでは観測されていない ATT&CK 技術を挙げ、その違いを説明してください。", en: "Name an ATT&CK technique that applies to the wider incident but was not observed by the sandbox, and explain the difference."}
    placeholder: {ja: "観測された挙動と、事案全体の説明を分けて書いてください。", en: "Separate observed behaviour from the wider incident description."}
    criteria:
      ja: "T1195.002 を、サンドボックスで観測された挙動ではなくインシデント全体を表す技術として区別していれば満点。"
      en: "Full marks for identifying T1195.002 as a description of the wider incident, not a sandbox-observed behaviour."
  - key: m3_r_virustotal_limit
    category: reasoning
    points: 2
    response_key: m3_vt_interpretation
    prompt: {ja: "VirusTotal の検索結果だけで、このファイルが安全か、悪意のあるものかを断定できますか。理由と、最終的な判断の根拠を説明してください。", en: "Can the VirusTotal search result alone establish whether this file is safe or malicious? Explain why, and what your final judgement actually rests on."}
    placeholder: {ja: "VirusTotal の結果と、最終判断の根拠を分けて書いてください。", en: "Separate the VirusTotal result from the evidence supporting the final conclusion."}
    criteria:
      - ja: "VirusTotal の結果だけで、ファイルが安全か、悪意のあるものかを断定していない（1点）"
        en: "Does not call the file safe or malicious from the VirusTotal result alone (1 pt)"
      - ja: "結論の根拠として SBX-K42 または SR-DEV-077 の端末証跡を挙げている（1点）"
        en: "Names SBX-K42 or the SR-DEV-077 endpoint evidence as support for the conclusion (1 pt)"
    facilitator_note:
      ja: "「検出0件だから安全」とした場合、この項目は0点です。検出数そのものは採点対象ではありません。"
      en: "If the team writes 'zero detections, therefore safe', score zero. The detection count itself is not graded."
  - key: m3_r_coverage
    response_key: m3_w_coverage
    category: completeness
    points: 10
    prompt: {ja: "IOC を種類ごとに一覧にしてください（ハッシュ・ドメイン・プロセス挙動・永続化・ファイルパス）。", en: "List the IOCs by type: hash, domain, process behaviour, persistence and file path."}
    placeholder: {ja: "種類ごとに1行。", en: "One line per type."}
    criteria:
      ja: "5種類すべてに具体的な値が入っていれば満点。全体ボードで求める5種類と同じです。"
      en: "Full marks for a concrete value in all five types, matching the five categories used on the class board."
