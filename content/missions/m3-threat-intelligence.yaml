    points: 4
    evidence_points: 4
    accepted_evidence: [proxy-log, network]
    prompt: {ja: "アップロードが完了した時刻をUTCで答えてください。", en: "Give the UTC time the upload completed."}
    placeholder: {ja: "2026-09-02T00:00:00Z", en: "2026-09-02T00:00:00Z"}
    help:
      ja: "アップロードは分割して行われているため、ログには複数の行が記録されています。ステータスコードによって意味が異なり、一方は一部のデータの受け付け、もう一方はオブジェクトの作成を示します。このログでアップロードの完了を示す行を選んでください。"
      en: "The upload was sent in parts, so more than one line records it, and their status codes do not mean the same thing: one says a part was accepted, the other says the object was created. Take the line that records completion."
    validator:
      kind: contains
      accept: ["00:42:19"]
    hints:
      - id: m3_upload_time_h1
        level: orientation
        cost: 0
        unlock_after: 0
        text: {ja: "proxy.log でアーカイブのアップロードに関する行を探してください。", en: "Find the archive-upload lines in proxy.log."}
      - id: m3_upload_time_h2
        level: pivot
        cost: 0
        unlock_after: 0
        text: {ja: "同じアップロードの開始と完了は別の行です。ステータスコードを確認してください。", en: "The upload start and completion are separate lines. Check their status codes."}
      - id: m3_upload_time_h3
        level: method
        cost: 0
        unlock_after: 0
        text: {ja: "アップロードの完了を示す行の UTC 時刻を入力してください。", en: "Use the UTC timestamp from the completed line."}

