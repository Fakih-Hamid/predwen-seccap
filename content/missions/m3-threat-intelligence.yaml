        cost: 0
        unlock_after: 0
        text: {ja: "3台それぞれについて、ファイル、通信、永続化の記録を確認してください。", en: "For each host, check the file, network and persistence evidence."}
      - id: m3_scope_h2
        level: pivot
        cost: 0
