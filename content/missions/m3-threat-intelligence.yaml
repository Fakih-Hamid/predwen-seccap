      - id: m3_exfil_h2
        level: pivot
        cost: 0
        unlock_after: 0
        text: {ja: "外向きのデータ送信と、完了したアップロードの宛先を確認してください。", en: "Find the outbound data transfer and the destination of the completed upload."}
