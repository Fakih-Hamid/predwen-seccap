    prompt: {ja: "SR-DEV-077 で検体が実行された時刻をUTCで答えてください。", en: "Give the UTC time the sample was executed on SR-DEV-077."}
    placeholder: {ja: "2026-09-02T00:00:00Z", en: "2026-09-02T00:00:00Z"}
    validator:
      kind: contains
      accept: ["00:19:16"]
    hints:
      - id: m3_execution_time_h1
        level: orientation
        cost: 0
        unlock_after: 0
        text: {ja: "file-timeline.csv を表計算ソフトで開き、まず SR-DEV-077 に絞り込んでください。", en: "Open file-timeline.csv in a spreadsheet and filter for SR-DEV-077 first."}
      - id: m3_execution_time_h2
        level: pivot
        cost: 0
        unlock_after: 0
        text: {ja: "event 列でプロセス開始を記録した行を探してください。", en: "Find the row whose event field records a process start."}
      - id: m3_execution_time_h3
        level: method
        cost: 0
        unlock_after: 0
