      en: "A host appearing in the telemetry is not the same as a host you can call compromised. The standard this pack uses is written in the analyst note in case-summary.json. Apply that one standard to all three hosts, and tick only the hosts where you can point at evidence that meets it."
    validator:
      kind: set_equal
    options:
