  - key: m3_parent
    type: short_text
    category: correctness
    points: 4
    evidence_points: 4
    accepted_evidence: [process-tree]
    prompt: {ja: "非表示で実行された PowerShell を起動したのは、どの実行ファイルですか。プロセスツリーの表記どおりにファイル名を答えてください。", en: "Which executable launched the hidden PowerShell? Give its file name, exactly as the process tree writes it."}
    placeholder: {ja: "実行ファイル名（例：name.exe）", en: "executable file name (e.g. name.exe)"}
    validator:
      kind: contains
      accept: ["SakuraVPNUpdate_4.2.1.exe"]
    hints:
      - id: m3_parent_h1
        level: orientation
        cost: 0
        unlock_after: 0
        text: {ja: "process-tree.json を開いてください。", en: "Open process-tree.json."}
      - id: m3_parent_h2
        level: pivot
        cost: 0
        unlock_after: 0
        text: {ja: "PowerShell のエントリにある ppid を確認し、その pid を持つエントリを探してください。そのエントリの image に実行ファイルのパスが入っています。", en: "Check the ppid on the PowerShell entry and find the entry whose pid matches it. That entry's image field holds the path to the executable."}
      - id: m3_parent_h3
        level: method
        cost: 0
        unlock_after: 0
        text: {ja: "パスではなくファイル名だけを、拡張子（.exe）まで含めて記録の表記どおりに入力してください。", en: "Give the file name only, not the whole path — including the .exe extension, exactly as the record writes it."}

  - key: m3_persistence
    type: multi_choice
    category: correctness
    points: 5
    evidence_points: 4
    accepted_evidence: [persistence]
    prompt: {ja: "このインシデントで新たに作成された永続化の仕組みをすべて選んでください。", en: "Select every persistence mechanism created by this incident."}
    help:
      ja: "表の各行には、その項目が今回のインシデントで作成されたのか、以前から存在していたのかを示す列があります。時刻だけでは区別できません。チェックを入れる前に、その列を確認してください。"
      en: "Each row carries a column saying whether that entry was created by this incident or was already on the machine. The timestamps alone will not separate them — read that column before you tick."
    validator:
      kind: set_equal
    options:
      - id: run_key
        correct: true
        label: {ja: "Run キー SakuraVPNCheck", en: "Run key SakuraVPNCheck"}
      - id: sched_task
        correct: true
        label: {ja: "スケジュールされたタスク SakuraVPN Update Check", en: "Scheduled task SakuraVPN Update Check"}
      - id: service
        label: {ja: "サービス SakuraSecureConnect", en: "The SakuraSecureConnect service"}
    hints:
      - id: m3_persistence_h1
        level: orientation
        cost: 0
        unlock_after: 0
        text: {ja: "persistence.csv を表計算ソフトで開いてください。", en: "Open persistence.csv in a spreadsheet."}
      - id: m3_persistence_h2
        level: pivot
        cost: 0
        unlock_after: 0
        text: {ja: "すべての行の result 列を確認してください。この事案より前から存在していた項目も混ざっています。", en: "Check the result column on every row. Entries that already existed before this incident are mixed in with the rest."}
      - id: m3_persistence_h3
        level: method
        cost: 0
        unlock_after: 0
        text: {ja: "result 列に新規作成と記録されている項目だけを選んでください。", en: "Select only the mechanisms whose result column records them as created."}

