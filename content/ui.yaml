    en: "This team is full. If you already joined, enter the same nickname you used before."

briefing:
  title: {ja: "はじめに", en: "Briefing"}
  story_title: {ja: "事案", en: "The incident"}
  story:
    ja: |-
      Sakura Robotics（サクラロボティクス）で、開発者アカウントへの不審なログインと、あるワークステーションから見慣れないドメインへの通信が検知されました。VPN クライアントの更新が、侵害された開発者アカウントを経由して配布された可能性があります。

      あなたのチームはインシデント対応チームです。何が起きたのかを調べ、すべての主張に根拠を付け、次に取るべき対応を提案してください。
    en: |-
      Sakura Robotics detected a suspicious login to a developer account and outbound traffic from a workstation to an unfamiliar domain. A VPN update may have been distributed through a compromised development account.

      Your team is the incident-response unit. Determine what happened, support every claim with evidence, and recommend the next actions.
  rules_title: {ja: "進め方", en: "How the exercise runs"}
  rules:
    ja: |-
      ミッション1〜3で順に調査を進め、ミッション4で報告書にまとめます。各ミッションには作業時間の目安があります。目安時間を過ぎても、自動的には終了しません。終了時はファシリテーターが案内します。前のミッションで得た情報は、次のミッションでも使用します。得点と順位はチーム単位で扱い、個人順位は表示しません。

      設問ごとに「この設問のヒント」があります。最初のヒントでは、確認する場所を案内します。ボタンを押すたびに、より具体的なヒントが1つずつ表示されます。資料のページには「行き詰まりましたか？」があり、その資料専用のヒントが出ます。ヒントを使っても減点はありません。

      一部の資料ではツールを使います。各資料ページに、手順、OS別コマンド、インストールできない場合の代替方法があります。初めて使うツールでも、その手順に沿って進められます。

      資料が読み込めない場合や、アクセスがブロックされたことを示すページが表示された場合は、スマートフォンのテザリングに接続して、もう一度試してください。
    en: |-
      There are three missions, completed in order. There is no hard time limit. Information from earlier missions remains useful later. Scores and rankings are by team only.

      Every question has its own "Hint for this question". The first press asks "Where do I look?", and each press after that is one step more specific. Every source page has "Stuck?", which gives hints about that source. Hints do not reduce your score.

      Some sources require a tool. Each source page gives the steps, commands for your operating system, and an alternative when installation is not possible. You do not need to have used the tool before.

      If a source does not load, or you get a page saying it is blocked, connect to a phone hotspot and try again.
  claims_title: {ja: "主張と証拠", en: "Claims and evidence"}
  claims:
    ja: "ユーザー名が一致していても、同一人物とは限りません。不審な指標が1つ見つかっただけでは、侵害があったとは断定できません。最終的な結論には、根拠となる資料と該当箇所を示してください。"
    en: "A username match does not prove identity. One suspicious indicator does not prove compromise. Every final claim must name its supporting source and excerpt."
  continue: {ja: "チーム画面へ", en: "Go to your team"}
  rejoin_title: {ja: "接続が切れたときは", en: "If you lose your session"}
  rejoin:
    ja: "ページを閉じたり接続が切れたりした場合は、同じチームコードと、前回と同じニックネームで参加し直してください。別のニックネームを使うと、チームに同じ人が2人いることになります。"
    en: "If you close the page or lose your session, join again with the same team code and the same nickname as before. A different nickname adds you to the team a second time."

