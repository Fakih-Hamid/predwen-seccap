  navigator_desc: {ja: "調査画面を操作し、チームの作業を進める。", en: "Drives the investigation view and keeps the team moving."}
  osint: {ja: "OSINT アナリスト", en: "OSINT Analyst"}
  osint_desc: {ja: "OSINT は公開情報調査のこと。アカウント・リポジトリ・メタデータの手がかりを調べる。", en: "OSINT is open-source intelligence: works the identity, repository and metadata clues."}
  infra: {ja: "インフラアナリスト", en: "Infrastructure Analyst"}
  infra_desc: {ja: "ドメイン・DNS・TLS・IP・HTTP に関する記録を調べる。", en: "Works the domain, DNS, TLS, IP and HTTP evidence."}
  cti: {ja: "CTI アナリスト", en: "CTI Analyst"}
  cti_desc: {ja: "CTI はサイバー脅威インテリジェンスのこと。サンドボックスで観測された挙動の分析、IOC（侵害指標）の整理、ATT&CK への対応付けを担当する。", en: "CTI is cyber threat intelligence: works the sandbox behaviour, the IOCs (indicators of compromise) and the ATT&CK mapping."}
  evidence: {ja: "エビデンス担当／発表担当", en: "Evidence Lead / Presenter"}
  evidence_desc: {ja: "証拠を整理し、根拠が十分でない結論を見直して、発表を準備する。", en: "Organises evidence, checks weak claims and prepares the presentation."}
  guide_title: {ja: "作業の分け方（任意）", en: "Ways to split the work (optional)"}
  guide_lead:
    ja: "調査の作業は、大きく5つに分けられます。担当を決めても、決めなくても構いません。1人で複数の作業を担当しても、複数人で同じ作業を進めても、途中で担当を交代しても問題ありません。"
    en: "The investigation has roughly five areas. Assign them if useful, or share them. One person can cover several, two people can work the same one, and you can switch at any time."
  guide_any_size:
    ja: "チーム人数に関係なく、すべての設問に必要な資料を利用できます。"
    en: "Every team has access to the material needed for every question, regardless of team size."

