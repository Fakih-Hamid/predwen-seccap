  err_session: {ja: "そのセッションコードは見つかりません。会場前方の画面に表示されているコードを確認してください。", en: "No session with that code. Check the code on the screen at the front."}
  err_team: {ja: "そのチームコードは見つかりません。", en: "No team with that code."}
  err_nickname: {ja: "ニックネームを入力してください。", en: "Enter a nickname."}
