<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -1 72 74">
  <!-- Predwen's mascot, the same shield used in the header (templates/_pred.svg).
       Standalone rather than an include: a favicon is fetched as its own
       document, so it carries its own namespace, its own gradient ids, and
       fixed colours that inherit nothing from a page — there is no page. The
       header copy uses a couple of inherited values; this one cannot.
       The viewBox is padded to a square because a tab icon is
       square, and a 64x72 box would letterbox the shield into a smaller mark. -->
  <defs>
    <linearGradient id="fBody" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#f7d07c"/><stop offset="0.5" stop-color="#edb154"/><stop offset="1" stop-color="#dc9636"/></linearGradient>
    <linearGradient id="fVisor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2442"/><stop offset="1" stop-color="#15111f"/></linearGradient>
    <radialGradient id="fEye" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#bff3fb"/><stop offset="1" stop-color="#4fc3d4"/></radialGradient>
  </defs>
  <path d="M32 3.5 L57 12 V33.5 C57 50.5 46.5 63 32 68.5 C17.5 63 7 50.5 7 33.5 V12 Z" fill="url(#fBody)" stroke="#14130f" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M32 1 l3.4 3.4 -3.4 3.4 -3.4 -3.4 z" fill="#4fc3d4" stroke="#14130f" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M15 16.5 Q23 11.5 32 11.5 L32 16.5 Q24 16.5 18 21.5 Z" fill="#fff" opacity="0.16"/>
  <rect x="15.5" y="27" width="33" height="16" rx="8" fill="url(#fVisor)" stroke="#14130f" stroke-width="2"/>
  <circle cx="25" cy="35" r="3.2" fill="url(#fEye)"/><circle cx="39" cy="35" r="3.2" fill="url(#fEye)"/>
  <circle cx="26.2" cy="33.8" r="0.95" fill="#fff"/><circle cx="40.2" cy="33.8" r="0.95" fill="#fff"/>
  <path d="M26.5 49.5 Q32 54.5 37.5 49.5" stroke="#14130f" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</svg>
